<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Window Container -->
  <rect x="40" y="35" width="720" height="380" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="46" rx="16" fill="#1E293B" />
  <rect x="40" y="65" width="720" height="16" fill="#1E293B" />
  <line x1="40" y1="81" x2="760" y2="81" stroke="#334155" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="68" cy="58" r="6" fill="#EF4444" />
  <circle cx="88" cy="58" r="6" fill="#F59E0B" />
  <circle cx="108" cy="58" r="6" fill="#10B981" />

  <!-- URL Bar -->
  <rect x="140" y="47" width="340" height="24" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="155" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="600" fill="#10B981">GET</text>
  <text x="185" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#94A3B8">http://140.245.24.219</text>

  <!-- Live Pulse Badge -->
  <rect x="630" y="48" width="105" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1" />
  <circle cx="645" cy="59" r="4" fill="#34D399" filter="url(#glow)" />
  <text x="657" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#6EE7B7" letter-spacing="0.5">200 OK • 0.4ms</text>

  <!-- Metrics Grid Inside Window -->
  <!-- Stat Card 1 -->
  <rect x="70" y="105" width="200" height="74" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="88" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">SERVICE STATUS</text>
  <text x="88" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Operational</text>
  <circle cx="245" cy="142" r="5" fill="#10B981" filter="url(#glow)" />

  <!-- Stat Card 2 -->
  <rect x="290" y="105" width="200" height="74" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="308" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">AVG LATENCY</text>
  <text x="308" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="18" font-weight="800" fill="#10B981">0.43 ms</text>
  <path d="M440 148 L455 136 L470 144" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Stat Card 3 -->
  <rect x="510" y="105" width="215" height="74" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <text x="528" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">SYSTEM UPTIME</text>
  <text x="528" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="18" font-weight="800" fill="#38BDF8">99.98%</text>

  <!-- JSON Payload Viewer Card -->
  <rect x="70" y="195" width="655" height="195" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1" />
  
  <text x="95" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#64748B">// RESPONSE JSON PAYLOAD (Node.js / Express Architecture)</text>
  
  <text x="95" y="255" font-family="Consolas, Monaco, monospace" font-size="13" fill="#E2E8F0">
    <tspan fill="#F43F5E">"architecture"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"Modular Microservices"</tspan><tspan fill="#94A3B8">, </tspan>
  </text>
  <text x="95" y="280" font-family="Consolas, Monaco, monospace" font-size="13" fill="#E2E8F0">
    <tspan fill="#F43F5E">"cluster_nodes"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#38BDF8">4</tspan><tspan fill="#94A3B8">, </tspan>
    <tspan fill="#F43F5E">"cache_engine"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"Redis Sentinel"</tspan><tspan fill="#94A3B8">, </tspan>
  </text>
  <text x="95" y="305" font-family="Consolas, Monaco, monospace" font-size="13" fill="#E2E8F0">
    <tspan fill="#F43F5E">"rate_limiter"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#F59E0B">true</tspan><tspan fill="#94A3B8">, </tspan>
    <tspan fill="#F43F5E">"environment"</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#34D399">"production"</tspan>
  </text>
  <text x="95" y="335" font-family="Consolas, Monaco, monospace" font-size="12" fill="#10B981">
    ✓ 0 schema errors • 256-bit TLS handshake verified • CI/CD auto-deploy
  </text>

  <!-- Bottom status line -->
  <line x1="70" y1="365" x2="725" y2="365" stroke="#1E293B" stroke-width="1" />
  <text x="95" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" fill="#475569">RESTful API • Express.js • Node.js • Automated Test Suite</text>
</svg>
