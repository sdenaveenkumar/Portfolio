    <circle cx="100" cy="280" r="1.5" /><circle cx="200" cy="280" r="1.5" /><circle cx="300" cy="280" r="1.5" /><circle cx="400" cy="280" r="1.5" /><circle cx="500" cy="280" r="1.5" /><circle cx="600" cy="280" r="1.5" /><circle cx="700" cy="280" r="1.5" />
    <circle cx="100" cy="380" r="1.5" /><circle cx="200" cy="380" r="1.5" /><circle cx="300" cy="380" r="1.5" /><circle cx="400" cy="380" r="1.5" /><circle cx="500" cy="380" r="1.5" /><circle cx="600" cy="380" r="1.5" /><circle cx="700" cy="380" r="1.5" />
