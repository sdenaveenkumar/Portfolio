    <polygon points="0,-45 40,-20 0,5 -40,-20" fill="#6B21A8" stroke="#F472B6" stroke-width="1.5" opacity="0.75" />
    <polygon points="0,5 40,-20 40,25 0,50" fill="#4A1D96" stroke="#C084FC" stroke-width="1.5" opacity="0.75" />
    <polygon points="0,5 -40,-20 -40,25 0,50" fill="#581C87" stroke="#A855F7" stroke-width="1.5" opacity="0.75" />
    <circle cx="0" cy="5" r="4" fill="#F472B6" />
    <circle cx="70" cy="-30" r="16" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="-50" cy="40" r="10" fill="#EC4899" opacity="0.6" />
