      <stop offset="0%" stop-color="#180B26" />
      <stop offset="50%" stop-color="#0E071A" />
      <stop offset="100%" stop-color="#2D0B2E" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="70%" cy="30%" r="60%">
