  <rect x="45" y="65" width="710" height="16" fill="#1E1434" />
  <line x1="45" y1="81" x2="755" y2="81" stroke="#2D1F47" stroke-width="1" />

  <circle cx="72" cy="58" r="5" fill="#EF4444" />
