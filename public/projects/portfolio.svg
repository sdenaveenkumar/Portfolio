  <text x="80" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Interactive 3D Universe</text>
  <text x="80" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#C4B5FD">React 19 • GSAP ScrollTrigger • Three.js Models • Physics Simulation</text>

